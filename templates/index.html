<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나만의 작은 식물방 모니터</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;600&display=swap');

    :root {
      --sprout-deep:     #4a6b47;
      --sprout-mid:      #78a973;
      --sprout-light:    #9ece9a;
      --sprout-pale:     #f1f7f0;
      --soil-brown:      #8d7765;
      --warm-beige:      #f9f6f0;
      --white:           #ffffff;
      --shadow:          rgba(120, 169, 115, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(160deg, #f3f7f2 0%, #e6efe4 40%, #dae8d7 80%, #c9dc light 100%);
      background-color: #e6efe4;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ── 아기자기한 나뭇잎 배경 ── */
    .garden-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .leaf-particle {
      position: absolute;
      bottom: -20px;
      font-size: 1.2rem;
      opacity: 0.6;
      animation: windSway 6s ease-in-out infinite;
    }

    @keyframes windSway {
      0%   { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-105vh) rotate(360deg) translateX(50px); opacity: 0; }
    }

    /* ── 레이아웃 ── */
    .container {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }
    header h1 {
      font-family: 'Gaegu', sans-serif;
      font-size: clamp(2.2rem, 6vw, 3rem);
      color: var(--sprout-deep);
      text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
    }
    header p.subtitle {
      margin-top: 4px;
      font-family: 'Gaegu', sans-serif;
      color: var(--soil-brown);
      font-size: 1.2rem;
      font-weight: 700;
    }

    /* ── 내추럴 다이어리 스타일 카드 ── */
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 2px dashed var(--sprout-light);
      border-radius: 24px;
      padding: 28px 32px;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px var(--shadow);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px var(--shadow);
    }

    .card-title {
      font-family: 'Gaegu', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--sprout-deep);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title::before {
      content: '🪴';
      font-size: 1.2rem;
    }

    /* ── 센서 그리드 ── */
    .sensor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 480px) { .sensor-grid { grid-template-columns: 1fr; } }

    .sensor-item {
      background: var(--warm-beige);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      border: 1px solid rgba(141, 119, 101, 0.15);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
    .sensor-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--soil-brown);
      margin-bottom: 6px;
    }
    .sensor-value {
      font-size: clamp(2.2rem, 6vw, 2.8rem);
      font-weight: 700;
      color: var(--sprout-deep);
      line-height: 1;
    }
    .sensor-unit {
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--sprout-mid);
      margin-left: 4px;
    }

    /* ── AI 응답 및 텍스트 ── */
    .ai-body {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #334231;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .plant-image-wrap {
      margin-top: 14px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid var(--sprout-light);
      background: #fff;
    }
    .plant-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: 340px;
      object-fit: cover;
    }
    .plant-image-caption {
      font-size: 0.8rem;
      color: var(--soil-brown);
      background: var(--sprout-pale);
      padding: 8px 10px;
      text-align: center;
      font-weight: 600;
      border-top: 1px dashed var(--sprout-light);
    }

    .ask-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 12px;
    }
    .ask-row input {
      border: 2px solid rgba(120, 169, 115, 0.4);
      border-radius: 14px;
      padding: 12px;
      font-size: 0.9rem;
      width: 100%;
      background: var(--warm-beige);
      outline: none;
    }
    .ask-row input:focus {
      border-color: var(--sprout-mid);
    }
    .ask-row button {
      border: none;
      background: var(--sprout-mid);
      color: #fff;
      border-radius: 14px;
      padding: 0 22px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 4px 10px var(--shadow);
      transition: background 0.2s;
    }
    .ask-row button:hover {
      background: var(--sprout-deep);
    }
    .ask-row button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ── 상태 배지 ── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--sprout-light);
      color: var(--sprout-deep);
      font-weight: 600;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #a2d240;
      animation: pulse 2s infinite;
    }
    .dot.stale { background: #eab159; animation: none; }
    .dot.loading { background: var(--sprout-mid); animation: pulse 0.8s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1;   box-shadow: 0 0 0 0 rgba(120,169,115,0.4); }
      50%       { opacity: 0.6; box-shadow: 0 0 0 6px rgba(120,169,115,0);  }
    }

    .last-update {
      font-size: 0.8rem;
      color: var(--soil-brown);
      font-weight: 600;
    }

    .settings-box {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--soil-brown);
      background: #fff;
      border: 1px solid rgba(120, 169, 115, 0.4);
      border-radius: 999px;
      padding: 4px 10px;
    }
    .settings-box input {
      width: 50px;
      border: 1px solid var(--sprout-light);
      border-radius: 999px;
      padding: 2px 6px;
      font-size: 0.8rem;
      text-align: center;
      color: var(--sprout-deep);
      outline: none;
    }
    .settings-box button {
      border: none;
      background: var(--sprout-mid);
      color: #fff;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* ── 로딩 스케leton ── */
    .skeleton {
      background: linear-gradient(90deg, #f0f5ef 25%, #dae8d7 50%, #f0f5ef 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
      height: 1.1em;
      margin: 6px 0;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── 모터 상태 태그 ── */
    .motor-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .motor-tag {
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 2px dashed transparent;
    }
    .motor-tag.on  { background: #eef7ee; border-color: var(--sprout-mid); color: var(--sprout-deep); }
    .motor-tag.off { background: #fdfbf7; border-color: #e2dbd5; color: var(--soil-brown); }

    footer {
      text-align: center;
      font-family: 'Gaegu', sans-serif;
      font-size: 1rem;
      color: var(--soil-brown);
      opacity: 0.7;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<div class="garden-bg" id="gardenBg"></div>

<div class="container">
  <header>
    <h1>🌿 나만의 작은 식물방</h1>
    <p class="subtitle">초록이 환경 모니터 &amp; AI 가드닝 멘토</p>
  </header>

  <div class="status-bar">
    <div class="badge">
      <span class="dot loading" id="dotEl"></span>
      <span id="statusText">연결 중...</span>
    </div>
    <span class="last-update" id="lastUpdateEl">마지막 기록: —</span>
    <div class="settings-box">
      <span>AI 관찰 주기(분)</span>
      <input id="intervalInput" type="number" min="1" max="120" value="3" />
      <button id="intervalBtn" type="button">변경</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">방 안의 실시간 날씨</div>
    <div class="sensor-grid">
      <div class="sensor-item">
        <div class="sensor-label">현재 온도</div>
        <div class="sensor-value" id="tempEl">—<span class="sensor-unit">°C</span></div>
      </div>
      <div class="sensor-item">
        <div class="sensor-label">토양/공기 습도</div>
        <div class="sensor-value" id="humEl">—<span class="sensor-unit">%</span></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">케어 장치 가동 상태</div>
    <div class="motor-row" id="motorRow">
      <span class="motor-tag off" id="fanTag">🌀 서큘레이터: —</span>
      <span class="motor-tag off" id="pumpTag">💧 자동 급수펌프: —</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">가드닝 멘토 Gemini의 조언</div>
    <div class="ai-body" id="aiBody">
      <div class="skeleton" style="width:85%"></div>
      <div class="skeleton" style="width:70%"></div>
      <div class="skeleton" style="width:75%"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">초록이 사진첩 &amp; 맞춤 질문</div>
    <div class="ai-body" id="plantBody">식물 관찰 카메라 이미지가 이곳에 보여집니다.</div>
    <div class="plant-image-wrap" id="plantImageWrap" style="display:none;">
      <img id="plantImageEl" class="plant-image" alt="최신 식물 사진" />
      <div class="plant-image-caption" id="plantImageCaption">최근 촬영된 사진</div>
    </div>
    <div class="ask-row">
      <input id="questionEl" type="text" placeholder="예: 잎 끝이 노랗게 변했는데 왜 이럴까?" />
      <button id="askBtn" type="button">물어보기</button>
    </div>
  </div>

  <footer>나의 작은 식물방 IoT 가드너 &bull; ESP32 + Gemini AI</footer>
</div>

<script>
  // ── 바람에 날리는 나뭇잎 파티클 생성 ──
  (function buildLeaves() {
    const bg = document.getElementById('gardenBg');
    const leafIcons = ['🌿', '🌱', '🍃', '☘️'];
    const count = 15;
    for (let i = 0; i < count; i++) {
      const leaf = document.createElement('div');
      leaf.className = 'leaf-particle';
      leaf.textContent = leafIcons[Math.floor(Math.random() * leafIcons.length)];
      
      const leftPos = Math.random() * 100;
      const delay = (Math.random() * 8).toFixed(2);
      const dur = (6 + Math.random() * 6).toFixed(2);
      
      leaf.style.cssText = `
        left: ${leftPos}%;
        animation-delay: ${delay}s;
        animation-duration: ${dur}s;
      `;
      bg.appendChild(leaf);
    }
  })();

  // ── [기존 기동 스크립트 그대로 유지] ──
  const $ = id => document.getElementById(id);
  const dotEl       = $('dotEl');
  const statusText  = $('statusText');
  const lastUpdate  = $('lastUpdateEl');
  const tempEl      = $('tempEl');
  const humEl       = $('humEl');
  const aiBody      = $('aiBody');
  const plantBody   = $('plantBody');
  const plantImageWrap = $('plantImageWrap');
  const plantImageEl = $('plantImageEl');
  const plantImageCaption = $('plantImageCaption');
  const fanTag      = $('fanTag');
  const pumpTag     = $('pumpTag');
  const questionEl  = $('questionEl');
  const askBtn      = $('askBtn');
  const intervalInput = $('intervalInput');
  const intervalBtn = $('intervalBtn');

  function setStatus(state) {
    dotEl.className = 'dot ' + state;
    statusText.textContent = state === 'loading' ? '일기 쓰는 중...'
                           : state === 'stale'   ? '초록이 대기 중'
                                                 : '연결됨';
  }

  function formatTime(isoStr) {
    if (!isoStr) return '—';
    try {
      return new Date(isoStr).toLocaleString('ko-KR', {
        month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
    } catch { return isoStr; }
  }

  function updateMotorTags(text) {
    const fanMatch  = text.match(/"?fan(?:_motor)?"?\s*:\s*"?(on|off|true|false|1|0)"?/i);
    const pumpMatch = text.match(/"?(?:water_?)?pump(?:_motor)?"?\s*:\s*"?(on|off|true|false|1|0)"?/i);
    const isOn = v => v && /on|true|1/i.test(v);

    const fanOn  = fanMatch  ? isOn(fanMatch[1])  : null;
    const pumpOn = pumpMatch ? isOn(pumpMatch[1]) : null;

    if (fanOn !== null) {
      fanTag.textContent = '🌀 서큘레이터: ' + (fanOn ? 'ON' : 'OFF');
      fanTag.className   = 'motor-tag ' + (fanOn ? 'on' : 'off');
    }
    if (pumpOn !== null) {
      pumpTag.textContent = '💧 자동 급수펌프: ' + (pumpOn ? 'ON' : 'OFF');
      pumpTag.className   = 'motor-tag ' + (pumpOn ? 'on' : 'off');
    }
  }

  async function loadSettings() {
    try {
      const res = await fetch('/api/settings', { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      if (data.sensor_analysis_interval_min != null) {
        intervalInput.value = Number(data.sensor_analysis_interval_min);
      }
    } catch (_) {}
  }

  async function applySettings() {
    try {
      intervalBtn.disabled = true;
      const minutes = Number(intervalInput.value || 3);
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sensor_analysis_interval_min: minutes })
      });
      if (!res.ok) return;
      await fetchLatest();
    } catch (_) {} finally {
      intervalBtn.disabled = false;
    }
  }

  async function fetchLatestImage() {
    try {
      const res = await fetch('/api/latest-image', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      if (!data || !data.image_b64 || !data.mime_type) {
        plantImageWrap.style.display = 'none';
        return;
      }

      plantImageEl.src = `data:${data.mime_type};base64,${data.image_b64}`;
      const ts = data.timestamp ? formatTime(data.timestamp) : '시간 정보 없음';
      plantImageCaption.textContent = `최근 촬영 사진 (${ts})`;
      plantImageWrap.style.display = 'block';

      if (data.plant_result) {
        plantBody.textContent = data.plant_result;
      }
    } catch (err) {
      console.error('[image fetch error]', err);
      plantImageWrap.style.display = 'none';
    }
  }

  async function analyzeImageNow() {
    try {
      askBtn.disabled = true;
      plantBody.textContent = '식물 상태 분석 중...';
      const res = await fetch('/api/analyze-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: (questionEl.value || '').trim() })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      plantBody.textContent = data.result || '(분석 결과 없음)';
      await fetchLatestImage();
    } catch (err) {
      plantBody.textContent = `분석 실패: ${err.message}`;
    } finally {
      askBtn.disabled = false;
    }
  }

  async function fetchLatest() {
    setStatus('loading');
    try {
      const res  = await fetch('/api/latest', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      if (!data.timestamp) {
        setStatus('stale');
        tempEl.innerHTML = '—<span class="sensor-unit">°C</span>';
        humEl.innerHTML  = '—<span class="sensor-unit">%</span>';
        aiBody.textContent = '센서에서 아직 일기가 도착하지 않았어요.';
        lastUpdate.textContent = '마지막 기록: —';
        await fetchLatestImage();
        return;
      }

      tempEl.innerHTML = `${parseFloat(data.temperature).toFixed(1)}<span class="sensor-unit">°C</span>`;
      humEl.innerHTML  = `${parseFloat(data.humidity).toFixed(1)}<span class="sensor-unit">%</span>`;

      const resultText = data.result || '(조언 없음)';
      aiBody.textContent = resultText;
      updateMotorTags(resultText);

      if (data.plant_result) plantBody.textContent = data.plant_result;

      const due = Number(data.analysis_due_in_sec || 0);
      const iv = Number(data.sensor_analysis_interval_min || intervalInput.value || 3);
      intervalInput.value = iv;
      lastUpdate.textContent = '마지막 기록: ' + formatTime(data.timestamp) + ` | 다음 분석 ${due}초 전`;
      setStatus('');
      await fetchLatestImage();
    } catch (err) {
      setStatus('stale');
      console.error('[fetch error]', err);
      plantImageWrap.style.display = 'none';
    }
  }

  askBtn.addEventListener('click', analyzeImageNow);
  intervalBtn.addEventListener('click', applySettings);
  loadSettings();
  fetchLatest();
  setInterval(fetchLatest, 30_000);
</script>
</body>
</html>
